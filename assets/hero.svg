    <text x="68" y="158" fill="#F4FFF9" font-size="62" font-weight="800" letter-spacing="-2.4">Никита Зайцев</text>
    <rect x="72" y="185" width="508" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="232" fill="#BBD4CE" font-size="23" font-weight="500">Проектирую, автоматизирую, проверяю.</text>
    <text x="72" y="270" fill="#7F9D96" font-size="18">Инфраструктура и продукты, которые работают не только на демо.</text>

    <g transform="translate(72 306)">
