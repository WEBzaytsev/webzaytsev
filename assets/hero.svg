<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Никита Зайцев — DevOps, Web, AI systems</title>
  <desc id="desc">Профильная обложка Никиты Зайцева</desc>
  <defs>
    <linearGradient id="bg" x1="52" y1="18" x2="1118" y2="353" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1D2A"/>
      <stop offset="1" stop-color="#102519"/>
    </linearGradient>
    <linearGradient id="accent" x1="196" y1="85" x2="1014" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62F6C5"/>
      <stop offset="0.52" stop-color="#48C6EF"/>
      <stop offset="1" stop-color="#A8FF78"/>
