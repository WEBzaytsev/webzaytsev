    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#C6FFF0" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.8">
    <path d="M838 66C943 19 1094 73 1114 173C1135 279 1019 336 906 300C793 264 744 108 838 66Z" stroke="url(#accent)" stroke-opacity="0.26"/>
    <path d="M876 89C963 51 1070 89 1088 176C1106 260 1017 306 924 277C830 247 797 124 876 89Z" stroke="url(#accent)" stroke-opacity="0.38"/>
    <path d="M914 115C981 86 1049 116 1061 181C1074 243 1013 277 945 255C877 233 854 141 914 115Z" stroke="url(#accent)" stroke-opacity="0.52"/>
    <circle cx="989" cy="184" r="13" fill="#62F6C5"/>
    <circle cx="989" cy="184" r="32" fill="#62F6C5" fill-opacity="0.14" filter="url(#blur)"/>
    <path d="M731 184H976" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 10"/>
    <circle cx="731" cy="184" r="5" fill="#48C6EF"/>
